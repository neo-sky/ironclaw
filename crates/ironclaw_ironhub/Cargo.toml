[package]
name = "ironclaw_ironhub"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "IronHub catalog install feature for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.ironclaw]
layer = "products"

[features]
test-support = []

[dependencies]
ironclaw_host_api = { path = "../ironclaw_host_api" }
ironclaw_host_ingress = { path = "../ironclaw_host_ingress" }
ironclaw_host_runtime = { path = "../ironclaw_host_runtime" }
ironclaw_extension_host = { path = "../ironclaw_extension_host" }
ironclaw_skills = { path = "../ironclaw_skills" }
ironclaw_common = { path = "../ironclaw_common" }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

ironclaw_extensions = { path = "../ironclaw_extensions" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
url = "2"
toml = "0.8"
zip = { version = "8", default-features = false, features = ["deflate"] }
async-trait = "0.1"
axum = "0.8"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
ed25519-dalek = { version = "2.2.0", features = ["std", "rand_core", "zeroize"] }

